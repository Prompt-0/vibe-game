<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibe Game - E2E Integration Test Suite</title>
  <style>
    body {
      font-family: monospace;
      padding: 2rem;

      font-size: 1.4rem;

      background-color: #2e3c30;
      color: #a6e3a1;

    .summary-fail {

  </style>
</head>
<body>
  <h1>Vibe Game: E2E Integration Test Suite</h1>
  <div id="summary">Running tests...</div>
  <div id="results"></div>

  <!-- Mock elements for testing components -->
  <div id="mock-dom" style="position: absolute; left: -9999px; top: -9999px;">
    <canvas id="mock-canvas"></canvas>
    <button id="mock-play-btn"></button>
    <input type="range" id="mock-volume-control" min="0" max="1" step="0.01" value="0.5">
    <button class="mock-theme-btn active" data-theme="nature"></button>
    <button class="mock-theme-btn" data-theme="abstract"></button>
    <button class="mock-theme-btn" data-theme="cosmic"></button>
  </div>

  <script>
    // ---------------------- WEB AUDIO API MOCKS ----------------------
    class MockAudioParam {
      constructor(value = 0) {
        this.value = value;
        this.calls = [];
      }
      setValueAtTime(val, time) {
        this.value = val;
        this.calls.push({ method: 'setValueAtTime', value: val, time });
        return this;
      }
      linearRampToValueAtTime(val, time) {
        this.value = val;
        this.calls.push({ method: 'linearRampToValueAtTime', value: val, time });
        return this;
      }
      exponentialRampToValueAtTime(val, time) {
        this.value = val;
        this.calls.push({ method: 'exponentialRampToValueAtTime', value: val, time });
        return this;
      }
    }

    class MockAudioNode {
      constructor() {
        this.connections = [];
      }
      connect(dest) {
        this.connections.push(dest);
        return dest;
      }
      disconnect() {
        this.connections = [];
      }
    }

    class MockGainNode extends MockAudioNode {
      constructor(initialGain = 1.0) {
        super();
        this.gain = new MockAudioParam(initialGain);
      }
    }

    class MockAnalyserNode extends MockAudioNode {
      constructor() {
        super();
        this.fftSize = 256;
      }
      getByteFrequencyData(array) {
        for (let i = 0; i < array.length; i++) {
          array[i] = Math.floor(Math.random() * 256);
        }
      }
      getByteTimeDomainData(array) {
        for (let i = 0; i < array.length; i++) {
          array[i] = 128;
        }
      }
    }

    class MockOscillatorNode extends MockAudioNode {
      constructor() {
        super();
        this.type = 'sine';
        this.frequency = new MockAudioParam(440);
        this.isStarted = false;
        this.isStopped = false;
        this.startedAt = null;
        this.stoppedAt = null;
      }
      start(time) {
        this.isStarted = true;
        this.startedAt = time;
      }
      stop(time) {
        this.isStopped = true;
        this.stoppedAt = time;
      }
    }

    class MockStereoPannerNode extends MockAudioNode {
      constructor() {
        super();
        this.pan = new MockAudioParam(0);
      }
    }

    class MockAudioContext {
      constructor() {
        this.state = 'suspended';
        this.currentTime = 0;
        this.destination = new MockAudioNode();
        this.nodesCreated = {
          gain: [],
          analyser: [],
          oscillator: [],
          panner: []
        };
      }
      createGain() {
        const node = new MockGainNode();
        this.nodesCreated.gain.push(node);
        return node;
      }
      createAnalyser() {
        const node = new MockAnalyserNode();
        this.nodesCreated.analyser.push(node);
        return node;
      }
      createOscillator() {
        const node = new MockOscillatorNode();
        this.nodesCreated.oscillator.push(node);
        return node;
      }
      createStereoPanner() {
        const node = new MockStereoPannerNode();
        this.nodesCreated.panner.push(node);
        return node;
      }
      resume() {
        this.state = 'running';
        return Promise.resolve();
      }
      suspend() {
        this.state = 'suspended';
        return Promise.resolve();
      }
    }

    // Attach mocks to global scope before modules load
    window.AudioContext = MockAudioContext;
    window.webkitAudioContext = MockAudioContext;
  </script>

  <script type="module">
    import { CanvasEngine } from '../src/graphics.js';
    import { AudioSynthesizer } from '../src/audio.js';
    import { UIController } from '../src/ui.js';
    import { initApp } from '../src/main.js';

    // Assertion helpers
    function assert(condition, message) {
      if (!condition) {
        throw new Error(message || "Assertion failed");
      }
    }

    function assertEquals(actual, expected, message) {
      if (actual !== expected) {
        throw new Error(`${message || "Assertion failed"}: expected [${expected}], got [${actual}]`);
      }
    }

    function assertInRange(val, min, max, message) {
      if (val < min || val > max) {
        throw new Error(`${message || "Assertion failed"}: value ${val} out of range [${min}, ${max}]`);
      }
    }

    // Test suite structure
    const tests = [];
    function addTest(tier, feature, name, fn) {
      tests.push({ tier, feature, name, fn });
    }

    // -------------------------------------------------------------
    // TIER 1: FEATURE COVERAGE (35 Tests, 5 per feature)
    // -------------------------------------------------------------

    // --- F1: Fullscreen Canvas Rendering ---
    addTest('Tier 1: Feature Coverage', 'F1: Fullscreen Canvas Rendering', 'F1-1: CanvasEngine is instantiable with a canvas', () => {
      const canvas = document.createElement('canvas');
      const engine = new CanvasEngine(canvas);
      assert(engine instanceof CanvasEngine, 'Must be an instance of CanvasEngine');
      engine.destroy();
    });

    addTest('Tier 1: Feature Coverage', 'F1: Fullscreen Canvas Rendering', 'F1-2: CanvasEngine scales width/height to viewport dimensions', () => {
      const canvas = document.createElement('canvas');
      const engine = new CanvasEngine(canvas);
      assertEquals(engine.canvas.width, window.innerWidth || 1);
      assertEquals(engine.canvas.height, window.innerHeight || 1);
      engine.destroy();
    });

    addTest('Tier 1: Feature Coverage', 'F1: Fullscreen Canvas Rendering', 'F1-3: CanvasEngine registers and triggers window resize listener', () => {
      const canvas = document.createElement('canvas');
      const engine = new CanvasEngine(canvas);
      const oldWidth = window.innerWidth;
      try {
        Object.defineProperty(window, 'innerWidth', { value: 1024, configurable: true });
        window.dispatchEvent(new Event('resize'));
        assertEquals(engine.canvas.width, 1024);
      } finally {
        Object.defineProperty(window, 'innerWidth', { value: oldWidth, configurable: true });
      }
      engine.destroy();
    });

    addTest('Tier 1: Feature Coverage', 'F1: Fullscreen Canvas Rendering', 'F1-4: CanvasEngine initializes 2D canvas context', () => {
      const canvas = document.createElement('canvas');
      const engine = new CanvasEngine(canvas);
      assert(engine.ctx instanceof CanvasRenderingContext2D, 'ctx must be CanvasRenderingContext2D');
      engine.destroy();
    });

    addTest('Tier 1: Feature Coverage', 'F1: Fullscreen Canvas Rendering', 'F1-5: CanvasEngine renders default state on creation', () => {
      const canvas = document.createElement('canvas');
      const engine = new CanvasEngine(canvas);
      engine.render();
      assertEquals(engine.theme, 'nature', 'Default theme must be nature');
      engine.destroy();
    });

    // --- F2: Theme Selection ---
    addTest('Tier 1: Feature Coverage', 'F2: Theme Selection', 'F2-1: setTheme on CanvasEngine changes active theme property', () => {
      const canvas = document.createElement('canvas');
      const engine = new CanvasEngine(canvas);
      engine.setTheme('cosmic');
      assertEquals(engine.theme, 'cosmic');
      engine.destroy();
    });

    addTest('Tier 1: Feature Coverage', 'F2: Theme Selection', 'F2-2: setTheme on AudioSynthesizer changes active theme property', () => {
      const synth = new AudioSynthesizer();
      synth.setTheme('abstract');
      assertEquals(synth.theme, 'abstract');
    });

    addTest('Tier 1: Feature Coverage', 'F2: Theme Selection', 'F2-3: UIController theme selection updates aria-checked attributes', () => {
      const btns = document.querySelectorAll('.mock-theme-btn');
      const ui = new UIController({ themeButtons: btns });
      ui.selectTheme(1); // Abstract
      assertEquals(btns[0].getAttribute('aria-checked'), 'false');
      assertEquals(btns[1].getAttribute('aria-checked'), 'true');
    });

    addTest('Tier 1: Feature Coverage', 'F2: Theme Selection', 'F2-4: UIController theme selection updates tabindex attributes', () => {
      const btns = document.querySelectorAll('.mock-theme-btn');
      const ui = new UIController({ themeButtons: btns });
      ui.selectTheme(2); // Cosmic
      assertEquals(btns[0].getAttribute('tabindex'), '-1');
      assertEquals(btns[2].getAttribute('tabindex'), '0');
    });

    addTest('Tier 1: Feature Coverage', 'F2: Theme Selection', 'F2-5: UIController theme selection updates document.documentElement data-theme', () => {
      const btns = document.querySelectorAll('.mock-theme-btn');
      const ui = new UIController({ themeButtons: btns });
      ui.selectTheme(0); // Nature
      assertEquals(document.documentElement.getAttribute('data-theme'), 'nature');
    });

    // --- F3: Interactive Visuals ---
    addTest('Tier 1: Feature Coverage', 'F3: Interactive Visuals', 'F3-1: CanvasEngine interact method executes without exceptions', () => {
      const canvas = document.createElement('canvas');
      const engine = new CanvasEngine(canvas);
      engine.interact(0.3, 0.4);
      assert(engine.interactions.length > 0, 'Interaction should be recorded');
      engine.destroy();
    });

    addTest('Tier 1: Feature Coverage', 'F3: Interactive Visuals', 'F3-2: UIController canvas click bubbles up to CanvasEngine', () => {
      const canvas = document.getElementById('mock-canvas');
      let interacted = false;
      const ui = new UIController({
        canvas,
        onInteract: () => { interacted = true; }
      });
      canvas.dispatchEvent(new MouseEvent('click', { clientX: 100, clientY: 100 }));
      assert(interacted, 'onInteract callback should be triggered');
    });

    addTest('Tier 1: Feature Coverage', 'F3: Interactive Visuals', 'F3-3: CanvasEngine creates visual interaction entry on trigger', () => {
      const canvas = document.createElement('canvas');
      const engine = new CanvasEngine(canvas);
      engine.triggerInteraction(0.5, 0.5);
      assertEquals(engine.interactions.length, 1);
      assertEquals(engine.interactions[0].x, 0.5);
      engine.destroy();
    });

    addTest('Tier 1: Feature Coverage', 'F3: Interactive Visuals', 'F3-4: CanvasEngine maps normalized coordinate bounds (0,0) and (1,1)', () => {
      const canvas = document.createElement('canvas');
      const engine = new CanvasEngine(canvas);
      engine.triggerInteraction(0, 0);
      engine.triggerInteraction(1, 1);
      assertEquals(engine.interactions[0].x, 0);
      assertEquals(engine.interactions[1].x, 1);
      engine.destroy();
    });

    addTest('Tier 1: Feature Coverage', 'F3: Interactive Visuals', 'F3-5: CanvasEngine updates and draws interactions in the render loop', () => {
      const canvas = document.createElement('canvas');
      const engine = new CanvasEngine(canvas);
      engine.triggerInteraction(0.5, 0.5);
      engine.render();
      assert(engine.interactions.length > 0);
      engine.destroy();
    });

    // --- F4: Ambient Audio ---
    addTest('Tier 1: Feature Coverage', 'F4: Ambient Audio', 'F4-1: AudioSynthesizer is paused by default', () => {
      const synth = new AudioSynthesizer();
      assert(synth.isPaused, 'Should be paused by default');
    });

    addTest('Tier 1: Feature Coverage', 'F4: Ambient Audio', 'F4-2: AudioSynthesizer play method resumes context and updates state', () => {
      const synth = new AudioSynthesizer();
      synth.play();
      assert(!synth.isPaused, 'Should not be paused after play');
      assertEquals(synth.ctx.state, 'running');
    });

    addTest('Tier 1: Feature Coverage', 'F4: Ambient Audio', 'F4-3: AudioSynthesizer pause method suspends context and updates state', () => {
      const synth = new AudioSynthesizer();
      synth.play();
      synth.pause();
      assert(synth.isPaused, 'Should be paused after pause');
      assertEquals(synth.ctx.state, 'suspended');
    });

    addTest('Tier 1: Feature Coverage', 'F4: Ambient Audio', 'F4-4: AudioSynthesizer volume property is set to default', () => {
      const synth = new AudioSynthesizer();
      assertEquals(synth.volume, 0.5);
    });

    addTest('Tier 1: Feature Coverage', 'F4: Ambient Audio', 'F4-5: AudioSynthesizer setVolume adjusts gain node value', () => {
      const synth = new AudioSynthesizer();
      synth.play();
      synth.setVolume(0.75);
      assertEquals(synth.volume, 0.75);
      assertEquals(synth.masterGain.gain.value, 0.75);
    });

    // --- F5: Interactive Audio & Harmonizer ---
    addTest('Tier 1: Feature Coverage', 'F5: Interactive Audio & Harmonizer', 'F5-1: AudioSynthesizer maps y-coordinate to correct scale notes', () => {
      const synth = new AudioSynthesizer();
      synth.play();
      synth.setTheme('nature');
      synth.triggerInteraction(0.5, 0.0); // Top of screen (index 9, highest pitch)
      let osc = synth.ctx.nodesCreated.oscillator[0];
      assertEquals(osc.frequency.value, 880.00); // Nature scale highest note
    });

    addTest('Tier 1: Feature Coverage', 'F5: Interactive Audio & Harmonizer', 'F5-2: AudioSynthesizer maps x-coordinate to panning parameter', () => {
      const synth = new AudioSynthesizer();
      synth.play();
      synth.triggerInteraction(0.2, 0.5); // x=0.2 maps to pan = 0.2*2-1 = -0.6
      let panner = synth.ctx.nodesCreated.panner[0];
      assert(Math.abs(panner.pan.value - (-0.6)) < 0.001);
    });

    addTest('Tier 1: Feature Coverage', 'F5: Interactive Audio & Harmonizer', 'F5-3: AudioSynthesizer playNote instantiates OscillatorNode and GainNode', () => {
      const synth = new AudioSynthesizer();
      synth.play();
      synth.playNote(440, 0);
      assert(synth.ctx.nodesCreated.oscillator.length > 0);
      assert(synth.ctx.nodesCreated.gain.length > 1); // master gain + note gain
    });

    addTest('Tier 1: Feature Coverage', 'F5: Interactive Audio & Harmonizer', 'F5-4: AudioSynthesizer selects oscillator wave type based on active theme', () => {
      const synth = new AudioSynthesizer();
      synth.play();
      synth.setTheme('cosmic');
      synth.playNote(440, 0);
      assertEquals(synth.ctx.nodesCreated.oscillator[0].type, 'sine');
      
      synth.setTheme('abstract');
      synth.playNote(440, 0);
      assertEquals(synth.ctx.nodesCreated.oscillator[1].type, 'triangle');
    });

    addTest('Tier 1: Feature Coverage', 'F5: Interactive Audio & Harmonizer', 'F5-5: AudioSynthesizer playNote connects oscillator node chain to destination', () => {
      const synth = new AudioSynthesizer();
      synth.play();
      synth.playNote(440, 0);
      const osc = synth.ctx.nodesCreated.oscillator[0];
      const panner = synth.ctx.nodesCreated.panner[0];
      const noteGain = synth.ctx.nodesCreated.gain[1];
      assert(osc.connections.includes(panner), 'Oscillator connects to Panner');
      assert(panner.connections.includes(noteGain), 'Panner connects to NoteGain');
      assert(noteGain.connections.includes(synth.masterGain), 'NoteGain connects to MasterGain');
    });

    // --- F6: Keyboard Accessibility ---
    addTest('Tier 1: Feature Coverage', 'F6: Keyboard Accessibility', 'F6-1: Active theme button is focusable (tabindex=0)', () => {
      const btns = document.querySelectorAll('.mock-theme-btn');
      const ui = new UIController({ themeButtons: btns });
      ui.selectTheme(0);
      assertEquals(btns[0].getAttribute('tabindex'), '0');
      assertEquals(btns[1].getAttribute('tabindex'), '-1');
    });

    addTest('Tier 1: Feature Coverage', 'F6: Keyboard Accessibility', 'F6-2: Pressing ArrowRight on theme button moves focus to next theme', () => {
      const btns = document.querySelectorAll('.mock-theme-btn');
      const ui = new UIController({ themeButtons: btns });
      ui.selectTheme(0);
      btns[0].focus();
      btns[0].dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true }));
      assertEquals(ui.activeThemeIndex, 1);
      assertEquals(document.activeElement, btns[1]);
    });

    addTest('Tier 1: Feature Coverage', 'F6: Keyboard Accessibility', 'F6-3: Pressing ArrowLeft on theme button moves focus to previous theme', () => {
      const btns = document.querySelectorAll('.mock-theme-btn');
      const ui = new UIController({ themeButtons: btns });
      ui.selectTheme(1);
      btns[1].focus();
      btns[1].dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowLeft', bubbles: true }));
      assertEquals(ui.activeThemeIndex, 0);
      assertEquals(document.activeElement, btns[0]);
    });

    addTest('Tier 1: Feature Coverage', 'F6: Keyboard Accessibility', 'F6-4: Pressing ArrowDown on theme button moves focus to next theme', () => {
      const btns = document.querySelectorAll('.mock-theme-btn');
      const ui = new UIController({ themeButtons: btns });
      ui.selectTheme(1);
      btns[1].focus();
      btns[1].dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowDown', bubbles: true }));
      assertEquals(ui.activeThemeIndex, 2);
      assertEquals(document.activeElement, btns[2]);
    });

    addTest('Tier 1: Feature Coverage', 'F6: Keyboard Accessibility', 'F6-5: Pressing ArrowUp on theme button moves focus to previous theme', () => {
      const btns = document.querySelectorAll('.mock-theme-btn');
      const ui = new UIController({ themeButtons: btns });
      ui.selectTheme(2);
      btns[2].focus();
      btns[2].dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowUp', bubbles: true }));
      assertEquals(ui.activeThemeIndex, 1);
      assertEquals(document.activeElement, btns[1]);
    });

    // --- F7: Performance & Memory Stability ---
    addTest('Tier 1: Feature Coverage', 'F7: Performance & Memory Stability', 'F7-1: CanvasEngine start initiates requestAnimationFrame loop', () => {
      const canvas = document.createElement('canvas');
      const engine = new CanvasEngine(canvas);
      let originalRAF = window.requestAnimationFrame;
      let rafCalled = false;
      window.requestAnimationFrame = (cb) => { rafCalled = true; return 123; };
      try {
        engine.start();
        assert(rafCalled, 'requestAnimationFrame should be called');
      } finally {
        window.requestAnimationFrame = originalRAF;
      }
      engine.destroy();
    });

    addTest('Tier 1: Feature Coverage', 'F7: Performance & Memory Stability', 'F7-2: CanvasEngine stop cancels animation frame', () => {
      const canvas = document.createElement('canvas');
      const engine = new CanvasEngine(canvas);
      let originalCAF = window.cancelAnimationFrame;
      let cafCalled = false;
      window.cancelAnimationFrame = (id) => { if (id === 123) cafCalled = true; };
      try {
        engine.animationFrameId = 123;
        engine.stop();
        assert(cafCalled, 'cancelAnimationFrame should be called');
      } finally {
        window.cancelAnimationFrame = originalCAF;
      }
      engine.destroy();
    });

    addTest('Tier 1: Feature Coverage', 'F7: Performance & Memory Stability', 'F7-3: CanvasEngine destroy removes window resize listener', () => {
      const canvas = document.createElement('canvas');
      const engine = new CanvasEngine(canvas);
      let originalRemove = window.removeEventListener;
      let removed = false;
      window.removeEventListener = (type, fn) => {
        if (type === 'resize') removed = true;
      };
      try {
        engine.destroy();
        assert(removed, 'resize listener should be removed');
      } finally {
        window.removeEventListener = originalRemove;
      }
    });

    addTest('Tier 1: Feature Coverage', 'F7: Performance & Memory Stability', 'F7-4: Fullscreen canvas size has correct LCP style parameters', () => {
      const canvas = document.getElementById('mock-canvas');
      canvas.style.position = 'absolute';
      canvas.style.top = '0';
      canvas.style.left = '0';
      canvas.style.width = '100%';
      canvas.style.height = '100%';
      assertEquals(canvas.style.width, '100%');
      assertEquals(canvas.style.height, '100%');
    });

    addTest('Tier 1: Feature Coverage', 'F7: Performance & Memory Stability', 'F7-5: AudioSynthesizer cleans up inactive oscillators over time', () => {
      const synth = new AudioSynthesizer();
      synth.play();
      synth.playNote(440, 0);
      assertEquals(synth.activeOscillators.length, 1);
      synth.ctx.currentTime = 2.0; // move past note duration
      synth.playNote(440, 0);
      assertEquals(synth.activeOscillators.length, 1); // first node is filtered out
    });

    // -------------------------------------------------------------
    // TIER 2: BOUNDARY & CORNER CASES (35 Tests, 5 per feature)
    // -------------------------------------------------------------

    // --- F1: Fullscreen Canvas Rendering (Boundary) ---
    addTest('Tier 2: Boundary Cases', 'F1: Fullscreen Canvas Rendering', 'F1-6: CanvasEngine throws on null/undefined canvas element', () => {
      try {
        new CanvasEngine(null);
        assert(false, 'Should have thrown error');
      } catch (e) {
        assert(e.message.includes('Canvas element is required'));
      }
    });

    addTest('Tier 2: Boundary Cases', 'F1: Fullscreen Canvas Rendering', 'F1-7: CanvasEngine handles zero window dimensions gracefully', () => {
      const canvas = document.createElement('canvas');
      const engine = new CanvasEngine(canvas);
      const oldW = window.innerWidth;
      const oldH = window.innerHeight;
      try {
        Object.defineProperty(window, 'innerWidth', { value: 0, configurable: true });
        Object.defineProperty(window, 'innerHeight', { value: 0, configurable: true });
        engine.resize();
        assert(engine.canvas.width >= 1);
        assert(engine.canvas.height >= 1);
      } finally {
        Object.defineProperty(window, 'innerWidth', { value: oldW, configurable: true });
        Object.defineProperty(window, 'innerHeight', { value: oldH, configurable: true });
      }
      engine.destroy();
    });

    addTest('Tier 2: Boundary Cases', 'F1: Fullscreen Canvas Rendering', 'F1-8: CanvasEngine handles extremely large window dimensions', () => {
      const canvas = document.createElement('canvas');
      const engine = new CanvasEngine(canvas);
      const oldW = window.innerWidth;
      const oldH = window.innerHeight;
      try {
        Object.defineProperty(window, 'innerWidth', { value: 8000, configurable: true });
        Object.defineProperty(window, 'innerHeight', { value: 8000, configurable: true });
        engine.resize();
        assertEquals(engine.canvas.width, 8000);
        assertEquals(engine.canvas.height, 8000);
      } finally {
        Object.defineProperty(window, 'innerWidth', { value: oldW, configurable: true });
        Object.defineProperty(window, 'innerHeight', { value: oldH, configurable: true });
      }
      engine.destroy();
    });

    addTest('Tier 2: Boundary Cases', 'F1: Fullscreen Canvas Rendering', 'F1-9: CanvasEngine supports high devicePixelRatio rendering loop', () => {
      const canvas = document.createElement('canvas');
      const engine = new CanvasEngine(canvas);
      engine.render();
      assert(true, 'Render completed successfully');
      engine.destroy();
    });

    addTest('Tier 2: Boundary Cases', 'F1: Fullscreen Canvas Rendering', 'F1-10: CanvasEngine handles rapid succession of resize events safely', () => {
      const canvas = document.createElement('canvas');
      const engine = new CanvasEngine(canvas);

    }

    // Run tests
    for (const tierName of Object.keys(groups)) {
      const tierSection = document.createElement('div');
      tierSection.className = 'tier-section';
      
      const tierHeader = document.createElement('h2');
      tierHeader.className = 'tier-header';
      tierHeader.innerText = tierName;
      tierSection.appendChild(tierHeader);

      for (const featureName of Object.keys(groups[tierName])) {
        const featureGroup = document.createElement('div');
        featureGroup.className = 'feature-group';
        featureGroup.innerText = `Feature: ${featureName}`;
        tierSection.appendChild(featureGroup);

        for (const test of groups[tierName][featureName]) {
          const testCaseEl = document.createElement('div');
          testCaseEl.className = 'test-case';
          
          const nameSpan = document.createElement('span');
          nameSpan.innerText = test.name;
          testCaseEl.appendChild(nameSpan);

          const statusSpan = document.createElement('span');
          statusSpan.style.fontWeight = 'bold';

          try {
            // Run actual test function
            test.fn();
            testCaseEl.classList.add('pass');
            statusSpan.innerText = 'PASS';
            passedCount++;
          } catch (err) {
            testCaseEl.classList.add('fail');
            statusSpan.innerText = 'FAIL';
            
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-details';
            errorDiv.innerText = `${err.message}\n${err.stack || ''}`;
            testCaseEl.appendChild(errorDiv);
            
            console.error(`FAILED: ${test.name}`, err);
            failedCount++;
          }

          testCaseEl.appendChild(statusSpan);
          tierSection.appendChild(testCaseEl);
        }
      }
      resultsDiv.appendChild(tierSection);
    }

    // Output final summary
    if (failedCount === 0) {
      summaryDiv.innerText = `SUCCESS: ${passedCount} of ${tests.length} tests passed.`;
      summaryDiv.className = 'summary-pass';
    } else {
      summaryDiv.innerText = `FAILURE: ${failedCount} of ${tests.length} tests failed. Total: ${tests.length}.`;
      summaryDiv.className = 'summary-fail';
    }

    // Save result summary as a global for verification scripts (e.g. puppeteer/headless)
    window.testResults = {
      passed: passedCount,
      failed: failedCount,
      total: tests.length,
      success: failedCount === 0
    };
  </script>
</body>
</html>
